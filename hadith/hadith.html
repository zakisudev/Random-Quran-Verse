<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hadith Pages - Explore authentic Hadith collections from various scholars" />
    <title>Hadith Pages</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./hadithp.css" />
  </head>
  <body>
    <div class="container">
      <aside class="menu-container" role="complementary" aria-label="Navigation menu">
        <header>
          <h1 class="header">Hadith Pages</h1>
        </header>
        <nav class="menu-item" aria-label="Main navigation">
          <section class="hadith-menu">
            <a href="../index.html" aria-label="Navigate to Quran pages">
              <button class="quran-b butn">QURAN PAGES</button>
            </a>
          </section>
        </nav>
        <!-- Advertisement placeholder -->
        <aside class="ad" aria-label="Advertisement">
          <span>Advertise Here</span>
        </aside>
      </aside>
      <main class="main-content" role="main">
        <section class="hadiths" aria-label="Hadith collection">
          <div class="hadith-head">
            <div class="kinds">
              <label for="hadith_kind">
                <h4>Select Collection</h4>
              </label>
              <select id="hadith_kind" aria-label="Select Hadith collection">
                <option value="abudawud">Abudawud</option>
                <option value="bukhari">Bukhari</option>
                <option value="ibnmajah">Ibn Majah</option>
                <option value="malik">Malik</option>
                <option value="muslim">Muslim</option>
                <option value="nasai">Nasai</option>
                <option value="tirmidhi">Tirmidhi</option>
              </select>
            </div>
            <div class="books">
              <label for="hadith_books">
                <h4>Select Book</h4>
              </label>
              <select id="hadith_books" aria-label="Select book">
                <!-- <option value="" selected disabled></option> -->
              </select>
            </div>
          </div>
          <button class="display" aria-label="List Hadith">List Hadith</button>
          <div class="verses" role="region" aria-label="Hadith list">
            <ol class="hadith_verses"></ol>
          </div>
        </section>
      </main>
    </div>
    <footer class="news" role="contentinfo" aria-label="News ticker">
      <div class="news_feed" aria-live="polite" aria-atomic="false"></div>
    </footer>
    <script type="module" src="./hadith.js"></script>
    <script type="module" src="./vars.js"></script>
  </body>
</html>
